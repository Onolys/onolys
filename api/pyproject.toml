[project]
name = "onolys-api"
version = "0.1.0"
description = "Onolys public /v1 API and job worker (one image, SERVICE_MODE api|worker|combined)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "onolys-miti[stt-google,voice-gemini]",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "google-cloud-firestore>=2.19",
    "google-cloud-storage>=2.18",
    "google-auth>=2.30",
    "requests>=2.31",
    "google-cloud-tasks>=2.16",
    "jsonschema>=4",
]

[tool.uv.sources]
onolys-miti = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "httpx>=0.27",
    "pytest-xdist>=3.6",
    "hypothesis>=6",
    "schemathesis>=4.33.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onolys_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live and not flaky'"
markers = [
  "unit: fast, no network or external services",
  "integration: multiple components or local services, no paid/live providers",
  "live: calls real external providers (STT/LLM); excluded by default",
  "firestore: needs the Firestore emulator (auto-applied in conftest); CI runs it in the api-emulator job",
  "firestore_smoke: keeps its [firestore] twin in test_rating/test_error_map/test_logging (conftest drops the rest)",
  "flaky: known-flaky test; excluded from the blocking run, run non-blocking in CI",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mutmut]
# Mutation testing: see docs/testing/fuzz-and-mutation.md. Whole package is copied; mutants are selected by name glob on the CLI.
source_paths = ["src/onolys_api/"]
do_not_mutate = ["src/onolys_api/adapters/*", "src/onolys_api/voice/*", "src/onolys_api/routes/*", "src/onolys_api/static/*", "src/onolys_api/app.py", "src/onolys_api/audio.py", "src/onolys_api/config.py", "src/onolys_api/contracts.py", "src/onolys_api/docs.py", "src/onolys_api/errors.py", "src/onolys_api/factory.py", "src/onolys_api/logs.py", "src/onolys_api/openapi.py", "src/onolys_api/presets.py", "src/onolys_api/rating.py", "src/onolys_api/storage/*", "src/onolys_api/schemas/*", "src/onolys_api/repo/fake.py", "src/onolys_api/repo/large.py", "src/onolys_api/repo/models.py", "src/onolys_api/repo/base.py", "src/onolys_api/jobs/[!r]*.py", "src/onolys_api/jobs/r[!u]*.py"]
pytest_add_cli_args = ["-m", "not live and not flaky", "-p", "no:cacheprovider"]
pytest_add_cli_args_test_selection = ["tests/test_auth.py", "tests/test_limits.py", "tests/test_run.py", "tests/test_caps.py", "tests/test_first_run.py"]
also_copy = ["../docs", "../config", "../engines", "openapi.json", "tests"]
