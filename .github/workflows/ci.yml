name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.flags.outputs.core }}
      oneshot: ${{ steps.flags.outputs.oneshot }}
      miti: ${{ steps.flags.outputs.miti }}
      api: ${{ steps.flags.outputs.api }}
      web: ${{ steps.flags.outputs.web }}
      infra: ${{ steps.flags.outputs.infra }}
    steps:
      # Pull requests: dorny/paths-filter lists the PR's changed files through the API.
      # Everything else (push to main, workflow_call from a release): every flag is 'true'.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # A package's anchor lists its own paths plus those of every package it depends on
          # (workspace dependency fan-out), so each filter is already transitive.
          filters: |
            ci_shared: &ci_shared
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/ci/**'
            py_shared: &py_shared
              - 'pyproject.toml'
              - 'uv.lock'
            core: &core
              - *ci_shared
              - *py_shared
              - 'engines/core/**'
            miti: &miti
              - *core
              - 'engines/miti/**'
            oneshot: &oneshot
              - *core
              - 'engines/oneshot/**'
              - 'scripts/gen_miti_schema.py'
              - 'config/staging/routes.yaml'
              - 'engines/miti/src/onolys_miti/data/pack.yaml'
              - 'engines/miti/src/onolys_miti/data/report.schema.json'
              - 'engines/miti/src/onolys_miti/data/prompts/code_system.md'
              - 'engines/miti/src/onolys_miti/data/prompts/globals_system.md'
              - 'engines/miti/src/onolys_miti/data/fixtures/good_practice.json'
            api: &api
              - *core
              - *miti
              - *oneshot
              - 'api/**'
              - 'config/**'
              - 'docs/contracts/public/**'
              - 'firestore.rules'
              - 'firebase.json'
              - 'firestore-rules-test/**'
            web:
              - *ci_shared
              - 'web/**'
              - 'api/firebase.json'
              - 'api/openapi.json'
              - 'engines/miti/src/onolys_miti/data/report.schema.json'
              - 'engines/miti/src/onolys_miti/data/fixtures/evaluation/**'
            infra:
              - *ci_shared
              - 'infra/**'
              - 'pyproject.toml'
              - 'uv.lock'
      - id: flags
        env:
          FORCE_ALL: ${{ github.event_name != 'pull_request' }}
          FILTER: ${{ toJSON(steps.filter.outputs) }}
        run: |
          for flag in core oneshot miti api web infra; do
            if [ "$FORCE_ALL" = "true" ]; then val=true; else val="$(jq -r --arg f "$flag" '.[$f]' <<<"$FILTER")"; fi
            echo "$flag=$val" >>"$GITHUB_OUTPUT"
          done

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: No LLM/STT keys in PR workflows
        run: python3 scripts/ci/check_no_llm_keys_in_pr_workflows.py
      - name: Config guard
        run: bash scripts/ci/check_config.sh
      - name: actionlint (workflows)
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 && ./actionlint -color

  engine-core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Unit tests use bundled model metadata and fixture clients, never provider calls.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --package onolys-engine-core
      - run: uv run --no-sync --package onolys-engine-core ruff check engines/core
      - name: Offline core tests (including the AST import boundary)
        run: uv run --no-sync --package onolys-engine-core pytest engines/core -m "not live"

  oneshot:
    needs: changes
    if: needs.changes.outputs.oneshot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Bundled model pricing and replayed synthetic replies; no provider credentials.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      MITI_LLM_RECORD: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Installs only one-shot and core; MITI reference data is read by path from checkout.
      - run: uv sync --frozen --package onolys-oneshot
      - run: uv run --no-sync --package onolys-oneshot ruff check engines/oneshot
      - name: Offline unit tests, recorded goldens and AST import boundary
        run: uv run --no-sync --package onolys-oneshot pytest engines/oneshot -m "not live"

  miti:
    needs: changes
    if: needs.changes.outputs.miti == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --package onolys-miti
      - run: uv run --no-sync --package onolys-miti ruff check engines/miti
      - name: pytest with coverage
        run: |
          uv run --no-sync --package onolys-miti pytest engines/miti -m "not live" \
            --cov=engines/miti/src --cov-report=
          {
            echo "### Coverage: onolys-miti"
            uv run --no-sync --package onolys-miti coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

  # api is split so the critical path is max(api-unit, api-emulator) + api-coverage (~30s), not their sum.
  # Selection: conftest.py adds the `firestore` marker to every test that needs the emulator
  # ([firestore] params, test_auth_emulator, test_firestore_emulator).
  # No branch protection / ruleset requires a status check named `api` (checked 2026-11-21), so there
  # is no aggregate job of that name; api-coverage is the gate for the pytest jobs.
  api-unit:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COVERAGE_CORE: sysmon
      COVERAGE_FILE: cov-data/unit.cov
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Setup cached static ffmpeg (validate step + integration test)
        uses: ./.github/actions/setup-ffmpeg
        timeout-minutes: 2
      - run: uv sync --frozen --package onolys-api
      - run: uv run --no-sync --package onolys-api ruff check api
      - name: pytest without the emulator (xdist, coverage data)
        run: |
          mkdir -p cov-data
          uv run --no-sync --package onolys-api pytest api -m "not live and not flaky and not firestore and not nightly" \
            -n 2 --durations=25 --cov=api/src --cov-report=
      - name: OpenAPI and public contracts are up to date
        run: |
          uv run --no-sync --package onolys-api python -m onolys_api.openapi
          uv run --no-sync --package onolys-api python -m onolys_api.contracts
          git diff --exit-code api/openapi.json docs/contracts/public
      - uses: actions/upload-artifact@v4
        with:
          name: api-coverage-unit
          path: cov-data/unit.cov
          include-hidden-files: true
          retention-days: 3

  api-emulator:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_TOOLS_VERSION: 15.37.0
      COVERAGE_CORE: sysmon
      COVERAGE_FILE: cov-data/emulator.cov
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache firebase-tools and emulator jars
        id: fbcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.firebase-tools
            ~/.cache/firebase/emulators
          key: firebase-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}
      - name: Install firebase-tools (skipped on cache hit)
        if: steps.fbcache.outputs.cache-hit != 'true'
        run: npm install --prefix ~/.firebase-tools firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}
      - run: echo "$HOME/.firebase-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Setup cached static ffmpeg (some emulator-backed tests shell out to it)
        uses: ./.github/actions/setup-ffmpeg
        timeout-minutes: 2
      - run: uv sync --frozen --package onolys-api
      # Serial on purpose: the JVM emulator shares 2 vCPU, and xdist raises transaction-lock timeouts.
      - name: pytest with Firestore emulator (coverage data)
        run: |
          mkdir -p cov-data
          firebase emulators:exec --config api/firebase.json --only firestore --project demo-onolys \
            'uv run --no-sync --package onolys-api pytest api -m "firestore and not live and not flaky and not nightly" --durations=25 --cov=api/src --cov-report='
      - uses: actions/upload-artifact@v4
        with:
          name: api-coverage-emulator
          path: cov-data/emulator.cov
          include-hidden-files: true
          retention-days: 3

  api-coverage:
    needs: [changes, api-unit, api-emulator]
    # always(): a skipped/failed upstream job must not skip this gate (a skipped required check passes).
    if: always() && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require upstream jobs to have succeeded
        run: |
          echo "api-unit=${{ needs.api-unit.result }} api-emulator=${{ needs.api-emulator.result }}"
          [ "${{ needs.api-unit.result }}" = "success" ] && [ "${{ needs.api-emulator.result }}" = "success" ] \
            || { echo "::error::api-unit/api-emulator did not succeed; coverage gate cannot pass"; exit 1; }
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/download-artifact@v4
        with:
          pattern: api-coverage-*
          path: cov-data
          merge-multiple: true
      - name: Combine coverage and enforce the gate
        run: |
          uvx --from coverage==7.17.3 coverage combine cov-data/unit.cov cov-data/emulator.cov
          {
            echo "### Coverage: onolys-api (unit + emulator combined)"
            uvx --from coverage==7.17.3 coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
          uvx --from coverage==7.17.3 coverage report --fail-under=94

  # Slow contention tests run on exact main candidates and nightly; failures remain visible.
  api-flaky:
    needs: changes
    if: needs.changes.outputs.api == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_TOOLS_VERSION: 15.37.0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache firebase-tools and emulator jars
        id: fbcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.firebase-tools
            ~/.cache/firebase/emulators
          key: firebase-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}
      - name: Install firebase-tools (skipped on cache hit)
        if: steps.fbcache.outputs.cache-hit != 'true'
        run: npm install --prefix ~/.firebase-tools firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}
      - run: echo "$HOME/.firebase-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen --package onolys-api
      # Setup and regression failures both fail the exact-candidate check.
      - name: Verify firebase-tools is usable
        run: firebase --version
      - name: Collect flaky tests (no emulator)
        id: flaky_collect
        shell: bash
        run: |
          set +e
          uv run --no-sync --package onolys-api pytest api -m "flaky and not live" --collect-only -q -p no:cacheprovider
          rc=$?
          # exit 5 = nothing collected: no flaky tests, skip emulator boot
          if [ $rc -eq 5 ]; then echo "no flaky tests"; echo "found=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ $rc -ne 0 ]; then exit $rc; fi
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: pytest contention regressions
        id: flaky_api
        if: steps.flaky_collect.outputs.found == 'true'
        shell: bash
        run: |
          set +e
          firebase emulators:exec --config api/firebase.json --only firestore --project demo-onolys \
            'uv run --no-sync --package onolys-api pytest api -m "flaky and not live" -p no:cacheprovider --durations=10'
          rc=$?
          if [ $rc -eq 5 ]; then echo "no flaky tests"; exit 0; fi
          exit $rc

  api-rules:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_TOOLS_VERSION: 15.37.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache firebase-tools and emulator jars
        id: fbcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.firebase-tools
            ~/.cache/firebase/emulators
          key: firebase-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}
      - name: Install firebase-tools (skipped on cache hit)
        if: steps.fbcache.outputs.cache-hit != 'true'
        run: npm install --prefix ~/.firebase-tools firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}
      - run: echo "$HOME/.firebase-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Firestore rules tests (emulator)
        run: |
          npm ci --prefix firestore-rules-test
          firebase emulators:exec --config firebase.json --only firestore --project demo-onolys \
            'npm test --prefix firestore-rules-test'

  api-image:
    needs: changes
    if: needs.changes.outputs.api == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Image builds and answers /v1/healthz (SERVICE_MODE=combined)
        run: |
          docker build -f api/Dockerfile --build-arg GIT_SHA="$GITHUB_SHA" -t onolys-api:ci .
          docker run -d --name onolys-api -p 8080:8080 -e ENV=local -e SERVICE_MODE=combined \
            -e APP_BASE_URL=http://localhost:5173 \
            onolys-api:ci
          for _ in $(seq 1 30); do curl -sf localhost:8080/v1/healthz && break; sleep 1; done
          curl -sf localhost:8080/v1/healthz \
            | jq -e --arg sha "$GITHUB_SHA" '.service_mode == "combined" and .code_version == $sha'
          docker logs onolys-api
          docker rm -f onolys-api
      - name: Prod LLM validator runs in the image exactly as deploy-prod runs it
        run: bash scripts/ci/smoke_prod_llm_validator.sh onolys-api:ci
      - name: Image ships core and MITI without protocols
        run: |
          docker run --rm --entrypoint python onolys-api:ci -c "import onolys_engine_core, onolys_miti"
          docker run --rm --entrypoint test onolys-api:ci ! -e /app/protocols
          docker image inspect onolys-api:ci --format 'image size bytes: {{.Size}}'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_TOOLS_VERSION: 15.37.0
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache firebase-tools and emulator jars
        id: fbcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.firebase-tools
            ~/.cache/firebase/emulators
          key: firebase-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}
      - name: Install firebase-tools (skipped on cache hit)
        if: steps.fbcache.outputs.cache-hit != 'true'
        run: npm install --prefix ~/.firebase-tools firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}
      - run: echo "$HOME/.firebase-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: gen:api staleness (generated types must match api/openapi.json and report.schema.json)
        run: npm run check:api
      - run: npm run typecheck
      - run: npm run lint
      - name: vitest with coverage (Auth emulator)
        shell: bash   # pipefail: a failing test fails the step despite tee
        run: |
          # needs @vitest/coverage-v8 in web/devDependencies
          firebase emulators:exec --only auth --config ../api/firebase.json --project demo-onolys \
            "npm test -- --coverage --coverage.reporter=text-summary" | tee coverage-summary.txt
          {
            echo "### Coverage: web"
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build

  # Real-browser suite (mock mode, no backend). Runs in parallel with `web`; blocking. Config: web/e2e_review/playwright.config.cjs
  web-e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_TOOLS_VERSION: 15.37.0
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache firebase-tools and emulator jars
        id: fbcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.firebase-tools
            ~/.cache/firebase/emulators
          key: firebase-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}
      - name: Install firebase-tools (skipped on cache hit)
        if: steps.fbcache.outputs.cache-hit != 'true'
        run: npm install --prefix ~/.firebase-tools firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}
      - run: echo "$HOME/.firebase-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Read installed Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Cache miss only: browser download from the Playwright CDN (seconds). No --with-deps: that runs apt (6-8 min);
      # the ubuntu runner image already ships the shared libs headless Chromium needs. A stall fails in 3 min.
      - name: Download Chromium (cache miss only, no apt)
        if: steps.pwcache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: npx playwright install chromium
      - name: Playwright e2e (dev server project + CSP/visual/axe project on the built app under the prod CSP; Auth emulator)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            firebase emulators:exec --only auth --config ../api/firebase.json --project demo-onolys \
              "npm run e2e -- --config e2e_review/playwright.smoke.config.cjs --trace off"
          else
            firebase emulators:exec --only auth --config ../api/firebase.json --project demo-onolys \
              "npm run e2e -- --trace off"
          fi
      - name: Upload Playwright results and light/dark screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-results
          path: web/e2e_review/test-results/
          retention-days: 3

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Static infra tests (offline)
        working-directory: .
        run: |
          uv sync --frozen --package onolys-engine-core
          uv run --no-sync --package onolys-engine-core pytest infra/scripts -q

  required:
    if: always()
    needs: [changes, guards, engine-core, oneshot, miti, api-unit, api-emulator, api-coverage, api-flaky, api-rules, api-image, web, web-e2e, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate every selected job and PR execution budget
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/ci/required_gate.py
