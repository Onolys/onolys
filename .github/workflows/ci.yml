name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      miti: ${{ steps.flags.outputs.miti }}
      api: ${{ steps.flags.outputs.api }}
      admin-auth: ${{ steps.flags.outputs.admin-auth }}
      admin-backend: ${{ steps.flags.outputs.admin-backend }}
      frontend: ${{ steps.flags.outputs.frontend }}
      web: ${{ steps.flags.outputs.web }}
      infra: ${{ steps.flags.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test changes.sh
        run: bash scripts/ci/test_changes.sh
      - name: Test changes.sh DEPS map against pyproject dependencies
        run: python3 scripts/ci/test_changes_deps.py
      - name: Check markdown links
        run: python3 scripts/ci/check_links.py
      - name: No LLM/STT keys in PR workflows (guard + planted-reference check)
        run: |
          python3 scripts/ci/check_no_llm_keys_in_pr_workflows.py
          if python3 scripts/ci/check_no_llm_keys_in_pr_workflows.py scripts/ci/key_guard_fixtures/bad >/dev/null; then
            echo "key guard did not fail on the planted fixture"; exit 1
          fi
      - name: Test deploy-prod staging image matcher
        run: python3 scripts/ci/test_staging_ran_image.py
      - name: Test workflow_run fork-safety guard
        run: python3 scripts/ci/test_workflow_run_guard.py
      - name: Test no checkout after GCP auth in workflows
        run: python3 scripts/ci/test_workflow_checkout_before_auth.py
      - name: Test config guard
        run: bash scripts/ci/test_check_config.sh
      - name: Test deploy-prod workflow guard
        run: bash scripts/ci/test_deploy_prod.sh
      - name: Test deploy-admin workflow guard
        run: bash scripts/ci/test_deploy_admin.sh
      - name: Test Hosting targets resolve per app (.firebaserc)
        run: bash scripts/ci/test_hosting_targets.sh
      - name: Test PR preview workflows and helpers
        run: bash scripts/ci/test_pr_preview.sh
      - name: actionlint (workflows)
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 && ./actionlint -color
      - id: flags
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "push" ]; then
            export FORCE_ALL=true
            files=""
          else
            files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          fi
          printf '%s\n' "$files" | bash scripts/ci/changes.sh

  miti:
    needs: changes
    if: needs.changes.outputs.miti == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --package onolys-miti
      - run: uv run --no-sync --package onolys-miti ruff check engines/miti
      - name: pytest with coverage
        run: |
          uv run --no-sync --package onolys-miti pytest engines/miti -m "not live" \
            --cov=engines/miti/src --cov-report=
          {
            echo "### Coverage: onolys-miti"
            uv run --no-sync --package onolys-miti coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

  # api is split so the critical path is max(api-unit, api-emulator) + api-coverage (~30s), not their sum.
  # Selection: conftest.py adds the `firestore` marker to every test that needs the emulator
  # ([firestore] params, test_auth_emulator, test_firestore_emulator).
  # No branch protection / ruleset requires a status check named `api` (checked 2026-11-21), so there
  # is no aggregate job of that name; api-coverage is the gate for the pytest jobs.
  api-unit:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COVERAGE_CORE: sysmon
      COVERAGE_FILE: cov-data/unit.cov
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install ffmpeg (validate step + integration test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --frozen --package onolys-api
      - run: uv run --no-sync --package onolys-api ruff check api
      - name: pytest without the emulator (xdist, coverage data)
        run: |
          mkdir -p cov-data
          uv run --no-sync --package onolys-api pytest api -m "not live and not flaky and not firestore" \
            -n 2 --durations=25 --cov=api/src --cov-report=
      - name: OpenAPI and public contracts are up to date
        run: |
          uv run --no-sync --package onolys-api python -m onolys_api.openapi
          uv run --no-sync --package onolys-api python -m onolys_api.contracts
          git diff --exit-code api/openapi.json docs/contracts/public
      - uses: actions/upload-artifact@v4
        with:
          name: api-coverage-unit
          path: cov-data/unit.cov
          include-hidden-files: true
          retention-days: 3

  api-emulator:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_TOOLS_VERSION: 15.37.0
      COVERAGE_CORE: sysmon
      COVERAGE_FILE: cov-data/emulator.cov
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache firebase-tools and emulator jars
        id: fbcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.firebase-tools
            ~/.cache/firebase/emulators
          key: firebase-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}
      - name: Install firebase-tools (skipped on cache hit)
        if: steps.fbcache.outputs.cache-hit != 'true'
        run: npm install --prefix ~/.firebase-tools firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}
      - run: echo "$HOME/.firebase-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install ffmpeg (some emulator-backed tests shell out to it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --frozen --package onolys-api
      # Serial on purpose: the JVM emulator shares 2 vCPU, and xdist raises transaction-lock timeouts.
      - name: pytest with Firestore emulator (coverage data)
        run: |
          mkdir -p cov-data
          firebase emulators:exec --config api/firebase.json --only firestore --project demo-onolys \
            'uv run --no-sync --package onolys-api pytest api -m "firestore and not live and not flaky" --durations=25 --cov=api/src --cov-report='
      - uses: actions/upload-artifact@v4
        with:
          name: api-coverage-emulator
          path: cov-data/emulator.cov
          include-hidden-files: true
          retention-days: 3

  api-coverage:
    needs: [changes, api-unit, api-emulator]
    # always(): a skipped/failed upstream job must not skip this gate (a skipped required check passes).
    if: always() && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require upstream jobs to have succeeded
        run: |
          echo "api-unit=${{ needs.api-unit.result }} api-emulator=${{ needs.api-emulator.result }}"
          [ "${{ needs.api-unit.result }}" = "success" ] && [ "${{ needs.api-emulator.result }}" = "success" ] \
            || { echo "::error::api-unit/api-emulator did not succeed; coverage gate cannot pass"; exit 1; }
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --package onolys-api
      - uses: actions/download-artifact@v4
        with:
          pattern: api-coverage-*
          path: cov-data
          merge-multiple: true
      - name: Combine coverage and enforce the gate
        run: |
          uv run --no-sync --package onolys-api coverage combine cov-data/unit.cov cov-data/emulator.cov
          {
            echo "### Coverage: onolys-api (unit + emulator combined)"
            uv run --no-sync --package onolys-api coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
          uv run --no-sync --package onolys-api coverage report --fail-under=94

  # Non-blocking: known-flaky emulator-contention tests. Job is green even when the step fails.
  api-flaky:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_TOOLS_VERSION: 15.37.0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache firebase-tools and emulator jars
        id: fbcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.firebase-tools
            ~/.cache/firebase/emulators
          key: firebase-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}
      - name: Install firebase-tools (skipped on cache hit)
        if: steps.fbcache.outputs.cache-hit != 'true'
        run: npm install --prefix ~/.firebase-tools firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}
      - run: echo "$HOME/.firebase-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen --package onolys-api
      # Setup must fail loudly; only the pytest step below is allowed to fail.
      - name: Verify firebase-tools is usable
        run: firebase --version
      - name: Collect flaky tests (no emulator)
        id: flaky_collect
        shell: bash
        run: |
          set +e
          uv run --no-sync --package onolys-api pytest api -m "flaky and not live" --collect-only -q -p no:cacheprovider
          rc=$?
          # exit 5 = nothing collected: no flaky tests, skip emulator boot
          if [ $rc -eq 5 ]; then echo "no flaky tests"; echo "found=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ $rc -ne 0 ]; then exit $rc; fi
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: pytest flaky (non-blocking)
        id: flaky_api
        if: steps.flaky_collect.outputs.found == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          firebase emulators:exec --config api/firebase.json --only firestore --project demo-onolys \
            'uv run --no-sync --package onolys-api pytest api -m "flaky and not live" -p no:cacheprovider --durations=10'
          rc=$?
          if [ $rc -eq 5 ]; then echo "no flaky tests"; exit 0; fi
          exit $rc
      - name: Warn on flaky api failures
        if: steps.flaky_api.outcome == 'failure'
        run: |
          echo "::warning title=Flaky tests failed::api flaky tests failed (non-blocking). See this step's log; open a follow-up to fix the root cause."
          echo "### :warning: api flaky tests failed (non-blocking)" >> "$GITHUB_STEP_SUMMARY"

  api-rules:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_TOOLS_VERSION: 15.37.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache firebase-tools and emulator jars
        id: fbcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.firebase-tools
            ~/.cache/firebase/emulators
          key: firebase-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}
      - name: Install firebase-tools (skipped on cache hit)
        if: steps.fbcache.outputs.cache-hit != 'true'
        run: npm install --prefix ~/.firebase-tools firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}
      - run: echo "$HOME/.firebase-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Firestore rules tests (emulator)
        run: |
          npm ci --prefix firestore-rules-test
          firebase emulators:exec --config firebase.json --only firestore --project demo-onolys \
            'npm test --prefix firestore-rules-test'

  api-image:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Image builds and answers /v1/healthz (SERVICE_MODE=combined)
        run: |
          docker build -f api/Dockerfile --build-arg GIT_SHA="$GITHUB_SHA" -t onolys-api:ci .
          docker run -d --name onolys-api -p 8080:8080 -e ENV=local -e SERVICE_MODE=combined \
            onolys-api:ci
          for _ in $(seq 1 30); do curl -sf localhost:8080/v1/healthz && break; sleep 1; done
          curl -sf localhost:8080/v1/healthz \
            | jq -e --arg sha "$GITHUB_SHA" '.service_mode == "combined" and .code_version == $sha'
          docker logs onolys-api
          docker rm -f onolys-api
      - name: Image ships only the miti engine (no old packages, no protocols)
        run: |
          for m in paudit onolys_core eaudit onolys_evaluation; do
            if docker run --rm --entrypoint python onolys-api:ci -c "import $m" 2>/dev/null; then
              echo "unexpected import $m in image"; exit 1
            fi
          done
          docker run --rm --entrypoint python onolys-api:ci -c "import onolys_miti"
          docker run --rm --entrypoint test onolys-api:ci ! -e /app/protocols
          docker image inspect onolys-api:ci --format 'image size bytes: {{.Size}}'

  admin-auth:
    needs: changes
    if: needs.changes.outputs.admin-auth == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --package onolys-admin-auth
      - run: uv run --no-sync --package onolys-admin-auth ruff check admin/auth
      - run: uv run --no-sync --package onolys-admin-auth pytest admin/auth

  admin-backend:
    needs: changes
    if: needs.changes.outputs.admin-backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --package onolys-admin-backend
      - run: uv run --no-sync --package onolys-admin-backend ruff check admin/backend
      - run: uv run --no-sync --package onolys-admin-backend pytest admin/backend
      - name: Image builds, rejects anonymous calls, refuses an empty allowlist, ships no eval data
        run: bash scripts/ci/test_admin_image.sh onolys-admin-backend:ci

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: gen:api staleness (generated types must match api/openapi.json and report.schema.json)
        run: npm run check:api
      - run: npm run typecheck
      - run: npm run lint
      - name: vitest with coverage
        shell: bash   # pipefail: a failing test fails the step despite tee
        run: |
          # needs @vitest/coverage-v8 in web/devDependencies
          npm test -- --coverage --coverage.reporter=text-summary | tee coverage-summary.txt
          {
            echo "### Coverage: web"
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: vitest flaky (non-blocking)
        id: flaky_web
        continue-on-error: true   # never fails the job; surfaced by the warning step below
        run: npm run test:flaky
      - name: Warn on flaky web failures
        if: steps.flaky_web.outcome == 'failure'
        run: |
          echo "::warning title=Flaky tests failed::web flaky tests failed (non-blocking). See this step's log; open a follow-up to fix the root cause."
          echo "### :warning: web flaky tests failed (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build

  # Real-browser suite (mock mode, no backend). Runs in parallel with `web`; blocking. Config: web/e2e_review/playwright.config.cjs
  web-e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Read Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium and system deps
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e (mock mode)
        run: npm run e2e -- --trace off
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-results
          path: web/e2e_review/test-results/
          retention-days: 3

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
