name: deploy-staging

# Merge to main -> staging (SP06 R13, R14 config guard, D5, D15). Runs after CI is green on main.
# One ordered pipeline: build -> infra-plan (Terraform plan of staging at this commit) -> infra-apply (only when the plan has
# changes) -> app deploy. Infra jobs are skipped while TF_STAGING_ENABLED is not 'true' (docs/reference/infra-pipeline.md).
# Repo variables (owner sets from Terraform outputs; see docs/reference/infra.md):
#   WIF_PROVIDER, DEPLOYER_STAGING_SA, GCP_PROJECT (optional, default onolys), GCP_REGION (optional, default us-central1),
#   STAGING_VITE_FIREBASE_API_KEY, STAGING_VITE_FIREBASE_AUTH_DOMAIN, STAGING_VITE_FIREBASE_APP_ID,
#   STAGING_VITE_FIREBASE_STORAGE_BUCKET, STAGING_VITE_FIREBASE_MESSAGING_SENDER_ID, STAGING_VITE_CONTACT_EMAIL (optional)
#   LLM_PROVIDER + LLM_MODEL (both or neither), LLM_EFFORT (optional; supported lowercase tier effort)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT: ${{ vars.STAGING_GCP_PROJECT || vars.GCP_PROJECT || 'onolys' }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  STAGING_SITE: ${{ vars.STAGING_GCP_PROJECT && vars.STAGING_HOSTING_SITE || 'onolys-app-staging' }}
  FIREBASE_TOOLS_VERSION: 15.37.0

jobs:
  build:
    # workflow_run `branches` matches the head branch NAME, so a fork PR from a branch called `main` would pass it.
    # Require a push-triggered CI run on this repo's own main before building/deploying that SHA.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      llm_provider: ${{ steps.llm.outputs.provider }}
      llm_model: ${{ steps.llm.outputs.model }}
      llm_effort: ${{ steps.llm.outputs.effort }}
      sha: ${{ steps.vars.outputs.sha }}
      image: ${{ steps.vars.outputs.repo }}@${{ steps.push.outputs.digest }}
    steps:
      - id: vars
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
          echo "repo=${REGION}-docker.pkg.dev/${PROJECT}/onolys/api" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.sha }}
      - name: Admit only current main with successful exact-SHA push CI (also manual)
        id: release
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ steps.vars.outputs.sha }}
        with:
          script: |
            const verify = require('./scripts/ci/verify_staging_release.cjs');
            await verify({github, context, sha: process.env.RELEASE_SHA});
      - name: Config guard (source tree)
        run: bash scripts/ci/check_config.sh
      - uses: astral-sh/setup-uv@v5
      - name: Validate staging LLM configuration before cloud side effects
        id: llm
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_EFFORT: ${{ vars.LLM_EFFORT }}
        run: uv run --frozen --package onolys-engine-core python scripts/ci/validate_staging_llm.py
      - name: Validate isolated staging release target before cloud authentication
        env:
          STAGING_GCP_PROJECT: ${{ vars.STAGING_GCP_PROJECT }}
          STAGING_WIF_PROVIDER: ${{ vars.STAGING_WIF_PROVIDER }}
          STAGING_DEPLOYER_SA: ${{ vars.STAGING_DEPLOYER_SA }}
          STAGING_HOSTING_SITE: ${{ vars.STAGING_HOSTING_SITE }}
          STAGING_ISOLATED_VITE_FIREBASE_API_KEY: ${{ vars.STAGING_ISOLATED_VITE_FIREBASE_API_KEY }}
          STAGING_ISOLATED_VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.STAGING_ISOLATED_VITE_FIREBASE_AUTH_DOMAIN }}
          STAGING_ISOLATED_VITE_FIREBASE_APP_ID: ${{ vars.STAGING_ISOLATED_VITE_FIREBASE_APP_ID }}
        run: python3 scripts/ci/release_target.py staging
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.STAGING_GCP_PROJECT && vars.STAGING_WIF_PROVIDER || vars.WIF_PROVIDER }}
          service_account: ${{ vars.STAGING_GCP_PROJECT && vars.STAGING_DEPLOYER_SA || vars.DEPLOYER_STAGING_SA }}
          token_format: access_token
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@v3
      - name: Build once, tag sha, push to Artifact Registry
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.repo }}:${{ steps.vars.outputs.sha }}
          build-args: GIT_SHA=${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Config guard (inside the pushed image, by digest)
        # Runs: docker run --rm --entrypoint test <image@digest> -s /app/config/<env>/<file>.yaml for each file.
        env:
          IMAGE: ${{ steps.vars.outputs.repo }}@${{ steps.push.outputs.digest }}
        run: bash scripts/ci/check_config.sh --image "$IMAGE"

  infra-plan:
    # Infrastructure first (docs/reference/infra-pipeline.md): plan staging at the commit being deployed. Skipped, and the
    # deploy runs exactly as before, until the owner sets TF_STAGING_ENABLED=true after bootstrapping the identities.
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && vars.TF_STAGING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      sha256: ${{ steps.plan.outputs.sha256 }}
      object: ${{ steps.plan.outputs.object }}
      live_sha256: ${{ steps.plan.outputs.live_sha256 }}
    steps:
      # The workflow's own ref: helper scripts and the terraform-plan/apply actions (never the deployed commit's copies).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The commit being deployed: its Terraform configuration only.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          path: target
          persist-credentials: false
      - id: plan
        uses: ./.github/actions/terraform-plan
        with:
          env: staging
          root: target/infra/isolated-environment
          tfroot: isolated
          project: onolys-staging
          bucket: onolys-staging-tfstate
          backend: examples/backend-staging.hcl.example
          varfile: examples/environment-staging.tfvars.example
          wif_provider: ${{ vars.STAGING_WIF_PROVIDER }}
          save: "true"

  infra-apply:
    # Only when the plan has changes; the app jobs below run after it, or right away when it is skipped.
    needs: [build, infra-plan]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.infra-plan.result == 'success' && needs.infra-plan.outputs.changes == 'true' }}
    runs-on: ubuntu-latest
    # Apply is a deploy-style job (Cloud Run, domains, Hosting can take several minutes); plan jobs stay within 5 minutes.
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      # The workflow's own ref: helper scripts and the terraform-plan/apply actions (never the deployed commit's copies).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The commit being deployed: its Terraform configuration only.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          path: target
          persist-credentials: false
      - uses: ./.github/actions/terraform-apply
        with:
          env: staging
          root: target/infra/isolated-environment
          tfroot: isolated
          project: onolys-staging
          bucket: onolys-staging-tfstate
          backend: examples/backend-staging.hcl.example
          wif_provider: ${{ vars.STAGING_WIF_PROVIDER }}
          plan_sha256: ${{ needs.infra-plan.outputs.sha256 }}
          plan_object: ${{ needs.infra-plan.outputs.object }}
          live_sha256: ${{ needs.infra-plan.outputs.live_sha256 }}

  # App jobs: every `if` starts with !cancelled() and checks each need's result explicitly. A skipped infra job (disabled, or
  # no changes) must not skip the app, and the default success() would (it also looks at skipped jobs further upstream).
  deploy-api:
    needs: [build, infra-plan, infra-apply]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.infra-plan.result == 'success' || needs.infra-plan.result == 'skipped') && (needs.infra-apply.result == 'success' || needs.infra-apply.result == 'skipped') }}
    permissions:
      contents: read
      id-token: write
      actions: read # requested by _deploy-cloudrun.yml (wait_for_job; unused here)
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      env: staging
      service: onolys-api-staging
      image: ${{ needs.build.outputs.image }}
      region: ${{ vars.GCP_REGION || 'us-central1' }}
      project: ${{ vars.STAGING_GCP_PROJECT || vars.GCP_PROJECT || 'onolys' }}
      workload_identity_provider: ${{ vars.STAGING_GCP_PROJECT && vars.STAGING_WIF_PROVIDER || vars.WIF_PROVIDER }}
      service_account: ${{ vars.STAGING_GCP_PROJECT && vars.STAGING_DEPLOYER_SA || vars.DEPLOYER_STAGING_SA }}
      git_sha: ${{ needs.build.outputs.sha }}
      # PR previews (pr-preview.yml) are no-traffic tagged revisions of THIS service and edit its template (combined mode,
      # stub adapters, CORS for the channel, CPU always allocated). Re-specify every key they override so none leaks
      # into staging (values mirror infra/modules/environment/services.tf for env=staging; CORS = app_staging_site_id + localhost),
      # and pin traffic to this revision by name.
      env_vars: |-
        SERVICE_MODE=api
        PR_PREVIEW=false
        ADAPTERS=real
        CORS_ORIGINS=https://${{ vars.STAGING_GCP_PROJECT && vars.STAGING_HOSTING_SITE || 'onolys-app-staging' }}.web.app\,http://localhost:5173
        APP_BASE_URL=https://${{ vars.STAGING_GCP_PROJECT && vars.STAGING_HOSTING_SITE || 'onolys-app-staging' }}.web.app
        EMAIL_FROM=Onolys <no-reply@onolys.com>
        LLM_PROVIDER=${{ needs.build.outputs.llm_provider }}
        LLM_MODEL=${{ needs.build.outputs.llm_model }}
        LLM_EFFORT=${{ needs.build.outputs.llm_effort }}
      flags: --cpu-throttling
      pin_traffic: true
    secrets: inherit

  sweep-previews:
    # Orphan PR-preview revisions whose cleanup could not delete them (Cloud Run keeps the newest revision). Never fatal.
    needs: [build, deploy-api]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.deploy-api.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.STAGING_GCP_PROJECT && vars.STAGING_WIF_PROVIDER || vars.WIF_PROVIDER }}
          service_account: ${{ vars.STAGING_GCP_PROJECT && vars.STAGING_DEPLOYER_SA || vars.DEPLOYER_STAGING_SA }}
      - name: Delete untagged non-latest preview revisions (non-fatal)
        env:
          GCP_PROJECT: ${{ env.PROJECT }}
          GCP_REGION: ${{ env.REGION }}
        run: bash scripts/ci/pr_preview.sh sweep || echo "::warning::preview revision sweep failed"

  deploy-worker:
    needs: [build, deploy-api]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.deploy-api.result == 'success' }}
    permissions:
      contents: read
      id-token: write
      actions: read # requested by _deploy-cloudrun.yml (wait_for_job; unused here)
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      env: staging
      service: onolys-worker-staging
      image: ${{ needs.build.outputs.image }}
      region: ${{ vars.GCP_REGION || 'us-central1' }}
      project: ${{ vars.STAGING_GCP_PROJECT || vars.GCP_PROJECT || 'onolys' }}
      workload_identity_provider: ${{ vars.STAGING_GCP_PROJECT && vars.STAGING_WIF_PROVIDER || vars.WIF_PROVIDER }}
      service_account: ${{ vars.STAGING_GCP_PROJECT && vars.STAGING_DEPLOYER_SA || vars.DEPLOYER_STAGING_SA }}
      git_sha: ${{ needs.build.outputs.sha }}
      # Empty vars = no override (routes.yaml wins). See docs/reference/infra.md "LLM provider and model".
      env_vars: |-
        LLM_PROVIDER=${{ needs.build.outputs.llm_provider }}
        LLM_MODEL=${{ needs.build.outputs.llm_model }}
        LLM_EFFORT=${{ needs.build.outputs.llm_effort }}
    secrets: inherit

  deploy-voice:
    needs: [build, deploy-api]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.deploy-api.result == 'success' }}
    permissions:
      contents: read
      id-token: write
      actions: read # requested by _deploy-cloudrun.yml (wait_for_job; unused here)
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      env: staging
      service: onolys-voice-staging
      image: ${{ needs.build.outputs.image }}
      region: ${{ vars.GCP_REGION || 'us-central1' }}
      project: ${{ vars.STAGING_GCP_PROJECT || vars.GCP_PROJECT || 'onolys' }}
      workload_identity_provider: ${{ vars.STAGING_GCP_PROJECT && vars.STAGING_WIF_PROVIDER || vars.WIF_PROVIDER }}
      service_account: ${{ vars.STAGING_GCP_PROJECT && vars.STAGING_DEPLOYER_SA || vars.DEPLOYER_STAGING_SA }}
      git_sha: ${{ needs.build.outputs.sha }}
      # Same image as the api; the mode comes from SERVICE_MODE (also set by Terraform on the service).
      env_vars: |-
        SERVICE_MODE=voice
    secrets: inherit

  rules:
    needs: [build, infra-plan, infra-apply]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.infra-plan.result == 'success' || needs.infra-plan.result == 'skipped') && (needs.infra-apply.result == 'success' || needs.infra-apply.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.STAGING_GCP_PROJECT && vars.STAGING_WIF_PROVIDER || vars.WIF_PROVIDER }}
          service_account: ${{ vars.STAGING_GCP_PROJECT && vars.STAGING_DEPLOYER_SA || vars.DEPLOYER_STAGING_SA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Firestore rules and indexes to the staging database only
        run: npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} deploy --only firestore:staging --project "$PROJECT" --non-interactive

  web:
    needs: [build, deploy-api]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.deploy-api.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web (staging)
        working-directory: web
        env:
          VITE_API_BASE_URL: /v1
          VITE_FIREBASE_PROJECT_ID: ${{ env.PROJECT }}
          VITE_APP_HOSTS: ${{ vars.STAGING_GCP_PROJECT && 'onolys-staging-app.web.app' || '' }}
          VITE_FIREBASE_API_KEY: ${{ vars.STAGING_GCP_PROJECT && vars.STAGING_ISOLATED_VITE_FIREBASE_API_KEY || (!vars.STAGING_GCP_PROJECT && vars.STAGING_VITE_FIREBASE_API_KEY) || '' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.STAGING_GCP_PROJECT && vars.STAGING_ISOLATED_VITE_FIREBASE_AUTH_DOMAIN || (!vars.STAGING_GCP_PROJECT && vars.STAGING_VITE_FIREBASE_AUTH_DOMAIN) || '' }}
          VITE_FIREBASE_APP_ID: ${{ vars.STAGING_GCP_PROJECT && vars.STAGING_ISOLATED_VITE_FIREBASE_APP_ID || (!vars.STAGING_GCP_PROJECT && vars.STAGING_VITE_FIREBASE_APP_ID) || '' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.STAGING_GCP_PROJECT && vars.STAGING_ISOLATED_VITE_FIREBASE_STORAGE_BUCKET || (!vars.STAGING_GCP_PROJECT && vars.STAGING_VITE_FIREBASE_STORAGE_BUCKET) || '' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.STAGING_GCP_PROJECT && vars.STAGING_ISOLATED_VITE_FIREBASE_MESSAGING_SENDER_ID || (!vars.STAGING_GCP_PROJECT && vars.STAGING_VITE_FIREBASE_MESSAGING_SENDER_ID) || '' }}
          VITE_CONTACT_EMAIL: ${{ vars.STAGING_VITE_CONTACT_EMAIL }}
          VITE_FIRESTORE_DATABASE: staging
        run: |
          npm ci
          npm run build
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.STAGING_GCP_PROJECT && vars.STAGING_WIF_PROVIDER || vars.WIF_PROVIDER }}
          service_account: ${{ vars.STAGING_GCP_PROJECT && vars.STAGING_DEPLOYER_SA || vars.DEPLOYER_STAGING_SA }}
      - name: Set up gcloud for the isolated staging voice origin lookup
        if: vars.STAGING_GCP_PROJECT != ''
        uses: google-github-actions/setup-gcloud@v2
      - name: Configure isolated staging voice origin in Hosting CSP
        if: vars.STAGING_GCP_PROJECT != ''
        run: |
          voice_url="$(gcloud run services describe onolys-voice-staging --project "$PROJECT" --region "$REGION" --format='value(status.url)')"
          python3 scripts/ci/release_target.py voice web/firebase.json "$voice_url"
      - name: Configure the selected project Hosting target
        run: python3 scripts/ci/release_target.py hosting web/firebase.json "$PROJECT" app-staging "$STAGING_SITE"
      - name: Deploy to Hosting target app-staging (site onolys-app-staging, /v1/** rewrite to onolys-api-staging)
        run: npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} deploy --config web/firebase.json --only hosting:app-staging --project "$PROJECT" --non-interactive

  smoke:
    needs: [build, deploy-api, deploy-worker, deploy-voice, rules, web]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.deploy-api.result == 'success' && needs.deploy-worker.result == 'success' && needs.deploy-voice.result == 'success' && needs.rules.result == 'success' && needs.web.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /v1/healthz through the Hosting rewrite
        env:
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          url="https://${STAGING_SITE}.web.app/v1/healthz"
          for i in $(seq 1 10); do
            if body="$(curl -sf --max-time 20 "$url")"; then break; fi
            echo "attempt $i failed; retrying"; sleep 6; body=""
          done
          [ -n "$body" ] || { echo "healthz did not return 200 at $url" >&2; exit 1; }
          echo "$body"
          echo "$body" | jq -e --arg sha "$SHA" '.code_version == $sha'
