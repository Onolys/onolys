name: _deploy-cloudrun

# Reusable: deploy ONE Cloud Run service by image digest (SP06 R13, D5, D15).
# Auth is Workload Identity Federation only (no JSON keys): the job impersonates deployer-<env>.
# Repo variables used (owner sets them from Terraform outputs):
#   vars.WIF_PROVIDER            <- output wif_provider
#   vars.DEPLOYER_STAGING_SA     <- output deployer_staging_email  (env == staging)
#   vars.DEPLOYER_PROD_SA        <- output deployer_prod_email     (env == prod; runs in GitHub environment `production`)
on:
  workflow_call:
    inputs:
      env:
        description: staging | prod | eval (eval deploys as deployer-staging, in the `staging` GitHub environment)
        required: true
        type: string
      service:
        description: Cloud Run service name, e.g. onolys-api-staging
        required: true
        type: string
      image:
        description: Full image reference pinned by digest (REGION-docker.pkg.dev/PROJECT/onolys/api@sha256:...)
        required: true
        type: string
      region:
        required: true
        type: string
      git_sha:
        description: Commit sha recorded as env GIT_SHA on the revision (D15)
        required: true
        type: string
      project:
        description: GCP project id
        required: false
        type: string
        default: onolys
      workload_identity_provider:
        description: Optional caller-selected WIF provider for an isolated project
        required: false
        type: string
        default: ''
      service_account:
        description: Optional caller-selected deployer in the target project
        required: false
        type: string
        default: ''
      env_vars:
        description: Extra KEY=VALUE env vars (newline-separated) set on the revision after GIT_SHA, merged with the service's own
        required: false
        type: string
        default: ''
      flags:
        description: Extra `gcloud run deploy` flags (space-separated)
        required: false
        type: string
        default: ''
      pin_traffic:
        description: >-
          Name the revision <service>-<sha7>-<run number>-<attempt> and send it 100% of traffic explicitly. Use on a service that
          also receives no-traffic tagged preview revisions: they can leave traffic pinned, and "latest" could be a preview.
        required: false
        type: boolean
        default: false
      wait_for_job:
        description: >-
          Name of a job in the calling run to wait for before deploying (deploy-prod.yml: `infra-apply` when the infra plan has
          changes). Lets the app deploy start together with that job, so both are released by ONE environment approval, while
          the deploy itself still runs after it and never over failed infrastructure. Empty = no wait.
        required: false
        type: string
        default: ''
    outputs:
      url:
        description: Deployed service URL
        value: ${{ jobs.deploy.outputs.url }}

permissions:
  contents: read
  id-token: write
  actions: read # wait_for_job reads this run's job list

jobs:
  deploy:
    runs-on: ubuntu-latest
    # +25 minutes of wait budget when waiting for the infra apply (its own timeout is 20 minutes).
    timeout-minutes: ${{ inputs.wait_for_job != '' && 40 || 15 }}
    # Prod deployer is only impersonable from the `production` GitHub environment (WIF attribute.environment).
    environment: ${{ inputs.env == 'prod' && 'production' || 'staging' }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Wait for infra-apply (approved together with this job; app deploys only after infrastructure)
        if: inputs.wait_for_job != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT_JOB: ${{ inputs.wait_for_job }}
        run: |
          # Same text in _deploy-cloudrun.yml and deploy-prod.yml (rules, web); scripts/ci/test_terraform_pipeline.py enforces it.
          set -euo pipefail
          deadline=$(( $(date +%s) + 25 * 60 ))
          while :; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100" \
              --jq "[.jobs[] | select(.name == \"${WAIT_JOB}\")] | .[0] | if . == null then \"missing\" else .status + \" \" + (.conclusion // \"\") end")"
            case "$state" in
              "completed success") echo "${WAIT_JOB} succeeded"; exit 0 ;;
              completed*) echo "::error::${WAIT_JOB} finished as '${state#completed }'; not deploying the app over unapplied infrastructure"; exit 1 ;;
            esac
            [ "$(date +%s)" -lt "$deadline" ] || { echo "::error::timed out waiting for ${WAIT_JOB} (${state})"; exit 1; }
            echo "waiting for ${WAIT_JOB}: ${state}"
            sleep 15
          done
      - name: Check inputs
        env:
          IMAGE: ${{ inputs.image }}
          ENV_NAME: ${{ inputs.env }}
        run: |
          case "$ENV_NAME" in staging|prod|eval) ;; *) echo "env must be staging, prod or eval" >&2; exit 1 ;; esac
          case "$IMAGE" in *@sha256:*) ;; *) echo "image must be pinned by digest (@sha256:...)" >&2; exit 1 ;; esac
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider || vars.WIF_PROVIDER }}
          service_account: ${{ inputs.service_account || (inputs.env == 'prod' && vars.DEPLOYER_PROD_SA || vars.DEPLOYER_STAGING_SA) }}
      - id: rev
        env:
          PIN: ${{ inputs.pin_traffic }}
          SERVICE: ${{ inputs.service }}
          GIT_SHA: ${{ inputs.git_sha }}
        run: |
          suffix=""; traffic=""
          if [ "$PIN" = "true" ]; then
            suffix="${GIT_SHA:0:7}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            traffic="${SERVICE}-${suffix}=100"
          fi
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "traffic=$traffic" >> "$GITHUB_OUTPUT"
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ inputs.service }}
          region: ${{ inputs.region }}
          project_id: ${{ inputs.project }}
          image: ${{ inputs.image }}
          env_vars: |-
            GIT_SHA=${{ inputs.git_sha }}
            ${{ inputs.env_vars }}
          flags: ${{ inputs.flags }}
          suffix: ${{ steps.rev.outputs.suffix }}
          revision_traffic: ${{ steps.rev.outputs.traffic }}
