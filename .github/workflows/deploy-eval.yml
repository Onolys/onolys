name: deploy-eval

# Eval environment (deployer-staging WIF). Terraform owns runtime settings/CORS/secrets/task audience.
# The image embeds provenance; deployment changes only the pinned image.
on:
  push:
    branches: [main]
    paths:
      - "eval/**"
      - "engines/**"
      - "config/**"
      - "api/pyproject.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
      - ".firebaserc"
      - "firebase.json"
      - "firestore.rules"
      - "api/firestore.indexes.json"
      - "scripts/ci/*eval*"
      - ".github/workflows/deploy-eval.yml"
  workflow_dispatch:

concurrency:
  group: deploy-eval-staging
  cancel-in-progress: false
permissions:
  contents: read
env:
  PROJECT: ${{ vars.GCP_PROJECT || 'onolys' }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  FIREBASE_TOOLS_VERSION: 15.37.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.vars.outputs.repo }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "repo=${REGION}-docker.pkg.dev/${PROJECT}/onolys/eval-backend" >> "$GITHUB_OUTPUT"
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_STAGING_SA }}
          token_format: access_token
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@v3
      - name: Build once and push the commit image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: eval/backend/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}
          push: true
          tags: ${{ steps.vars.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha,scope=eval-backend
          cache-to: type=gha,mode=max,scope=eval-backend
      - name: Smoke the exact pushed image (auth, runtime imports, no datasets)
        env:
          IMAGE: ${{ steps.vars.outputs.repo }}@${{ steps.push.outputs.digest }}
          EXPECTED_GIT_SHA: ${{ github.sha }}
        run: |
          docker pull "$IMAGE"
          SKIP_BUILD=1 bash scripts/ci/test_eval_image.sh "$IMAGE"

  deploy-backend:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_STAGING_SA }}
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ env.PROJECT }}
          region: ${{ env.REGION }}
          service: onolys-eval-backend-eval
          image: ${{ needs.build.outputs.image }}
          skip_default_labels: true

  site:
    needs: deploy-backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            eval/web/package-lock.json
            web/package-lock.json
      - name: Install prod web deps (eval/web typechecks web/src/auth)
        working-directory: web
        run: npm ci
      - name: Build eval SPA with deployed API URL and the prod Firebase app
        working-directory: eval/web
        env:
          VITE_EVAL_API_URL: ${{ needs.deploy-backend.outputs.url }}
          VITE_FIREBASE_PROJECT_ID: ${{ env.PROJECT }}
          VITE_FIREBASE_API_KEY: ${{ vars.PROD_VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: eval.onolys.com
          VITE_FIREBASE_APP_ID: ${{ vars.PROD_VITE_FIREBASE_APP_ID }}
          VITE_APP_URL: https://app.onolys.com
        run: |
          for v in VITE_EVAL_API_URL VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_APP_ID; do
            [ -n "${!v}" ] || { echo "missing build variable $v" >&2; exit 1; }
          done
          npm ci
          npm run build
      - name: Substitute the exact backend origin into Hosting CSP
        env:
          BACKEND_URL: ${{ needs.deploy-backend.outputs.url }}
        run: bash scripts/ci/set_eval_origin.sh "${BACKEND_URL%/}" eval/web/firebase.json
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_STAGING_SA }}
      - name: Deploy only eval-staging Hosting
        run: npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} deploy --config eval/web/firebase.json --only "hosting:eval-staging" --project "$PROJECT" --non-interactive

  firestore:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_STAGING_SA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy rules and indexes to the eval database only
        run: npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} deploy --only firestore:eval --project "$PROJECT" --non-interactive

  smoke:
    needs: [deploy-backend, site, firestore]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Anonymous API is rejected and Hosting CSP permits the backend
        env:
          BACKEND_URL: ${{ needs.deploy-backend.outputs.url }}
        run: |
          origin="${BACKEND_URL%/}"
          code=000
          for i in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$origin/v1/me" || true)"
            [ "$code" = 401 ] && break
            echo "attempt $i: /v1/me -> $code; retrying"; sleep 6
          done
          [ "$code" = 401 ] || { echo "anonymous /v1/me returned $code, want 401" >&2; exit 1; }
          headers="$(curl -sfI --max-time 20 https://onolys-eval-staging.web.app/)"
          echo "$headers" | grep -i '^content-security-policy:' | grep -qF "$origin" \
            || { echo "Hosting CSP missing backend $origin" >&2; exit 1; }
          echo "ok anonymous /v1/me -> 401; Hosting CSP permits $origin"
