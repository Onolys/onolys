name: deploy-eval

# Independent eval release, automatic like staging: runs after CI is green on main (or manually).
# Current main with successful exact-SHA push CI. Worker, backend, site and rules share one trusted commit
# and this eval-only lock (separate from deploy-staging's lock, so the two never cancel or queue each other).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-eval
  cancel-in-progress: false

permissions:
  contents: read
env:
  PROJECT: ${{ vars.EVAL_GCP_PROJECT }}
  EVAL_SITE: ${{ vars.EVAL_HOSTING_SITE }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  FIREBASE_TOOLS_VERSION: 15.37.0

jobs:
  build:
    # workflow_run `branches` matches the head branch NAME, so a fork PR from a branch called `main` would pass it.
    # Require a push-triggered CI run on this repo's own main before building/deploying that SHA.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      worker_image: ${{ steps.vars.outputs.worker_repo }}@${{ steps.push-worker.outputs.digest }}
      image: ${{ steps.vars.outputs.repo }}@${{ steps.push.outputs.digest }}
    steps:
      # Under workflow_run, github.sha is default-branch HEAD, not the CI run's commit: use its head_sha.
      - id: sha
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}
      - name: Admit only current main with successful exact-SHA push CI
        id: release
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ steps.sha.outputs.sha }}
        with:
          script: |
            const verify = require('./scripts/ci/verify_staging_release.cjs');
            await verify({github, context, sha: process.env.RELEASE_SHA});
      - name: Config guard (source tree)
        run: bash scripts/ci/check_config.sh
      - id: vars
        run: |
          echo "repo=${REGION}-docker.pkg.dev/${PROJECT}/onolys/eval-backend" >> "$GITHUB_OUTPUT"
          echo "worker_repo=${REGION}-docker.pkg.dev/${PROJECT}/onolys/eval-worker" >> "$GITHUB_OUTPUT"
      - name: Validate isolated eval release target before cloud authentication
        env:
          EVAL_GCP_PROJECT: ${{ vars.EVAL_GCP_PROJECT }}
          EVAL_WIF_PROVIDER: ${{ vars.EVAL_WIF_PROVIDER }}
          EVAL_DEPLOYER_SA: ${{ vars.EVAL_DEPLOYER_SA }}
          EVAL_HOSTING_SITE: ${{ vars.EVAL_HOSTING_SITE }}
          EVAL_VITE_FIREBASE_API_KEY: ${{ vars.EVAL_VITE_FIREBASE_API_KEY }}
          EVAL_VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.EVAL_VITE_FIREBASE_AUTH_DOMAIN }}
          EVAL_VITE_FIREBASE_APP_ID: ${{ vars.EVAL_VITE_FIREBASE_APP_ID }}
        run: python3 scripts/ci/release_target.py eval
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.EVAL_WIF_PROVIDER }}
          service_account: ${{ vars.EVAL_DEPLOYER_SA }}
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check eval services are provisioned and accessible before publishing images
        run: |
          for service in onolys-worker-eval onolys-eval-backend-eval; do
            if ! gcloud run services describe "$service" --project "$PROJECT" --region "$REGION" --format='value(metadata.name)'; then
              echo "::error::Eval service $service is missing or inaccessible. An infrastructure owner must review/apply the existing SP03 Terraform and verify eval IAM and secret versions; see docs/reference/infra.md. This workflow only releases provisioned services."
              exit 1
            fi
          done
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@v3
      - name: Build once and push the commit image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: eval/backend/Dockerfile
          build-args: GIT_SHA=${{ steps.sha.outputs.sha }}
          push: true
          tags: ${{ steps.vars.outputs.repo }}:${{ steps.sha.outputs.sha }}
          cache-from: type=gha,scope=eval-backend
          cache-to: type=gha,mode=max,scope=eval-backend
      - name: Smoke the exact pushed image (auth, runtime imports, no datasets)
        env:
          IMAGE: ${{ steps.vars.outputs.repo }}@${{ steps.push.outputs.digest }}
          EXPECTED_GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          docker pull "$IMAGE"
          SKIP_BUILD=1 bash scripts/ci/test_eval_image.sh "$IMAGE"
      - name: Build and push eval worker from the app runtime Dockerfile
        id: push-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          build-args: GIT_SHA=${{ steps.sha.outputs.sha }}
          push: true
          tags: ${{ steps.vars.outputs.worker_repo }}:${{ steps.sha.outputs.sha }}
          cache-from: type=gha,scope=eval-worker
          cache-to: type=gha,mode=max,scope=eval-worker
      - name: Config guard (inside the eval worker image, by digest)
        env:
          IMAGE: ${{ steps.vars.outputs.worker_repo }}@${{ steps.push-worker.outputs.digest }}
        run: bash scripts/ci/check_config.sh --image "$IMAGE"

  deploy-worker:
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-cloudrun.yml
    with:
      env: eval
      service: onolys-worker-eval
      image: ${{ needs.build.outputs.worker_image }}
      region: ${{ vars.GCP_REGION || 'us-central1' }}
      project: ${{ vars.EVAL_GCP_PROJECT }}
      workload_identity_provider: ${{ vars.EVAL_WIF_PROVIDER }}
      service_account: ${{ vars.EVAL_DEPLOYER_SA }}
      git_sha: ${{ needs.build.outputs.sha }}
      # Terraform owns eval mode, routes, secrets and queue settings.
    secrets: inherit

  deploy-backend:
    needs: [build, deploy-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.EVAL_WIF_PROVIDER }}
          service_account: ${{ vars.EVAL_DEPLOYER_SA }}
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ env.PROJECT }}
          region: ${{ env.REGION }}
          service: onolys-eval-backend-eval
          image: ${{ needs.build.outputs.image }}
          skip_default_labels: true
          env_vars: GIT_SHA=${{ needs.build.outputs.sha }}

  site:
    needs: [build, deploy-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            eval/web/package-lock.json
            web/package-lock.json
      - name: Install prod web deps (eval/web typechecks web/src/auth)
        working-directory: web
        run: npm ci
      - name: Build eval SPA with deployed API URL and the eval project's own Firebase app
        working-directory: eval/web
        env:
          VITE_EVAL_API_URL: ${{ needs.deploy-backend.outputs.url }}
          VITE_FIREBASE_PROJECT_ID: ${{ env.PROJECT }}
          VITE_FIREBASE_API_KEY: ${{ vars.EVAL_VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.EVAL_VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_APP_ID: ${{ vars.EVAL_VITE_FIREBASE_APP_ID }}
        run: |
          for v in VITE_EVAL_API_URL VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_APP_ID; do
            [ -n "${!v}" ] || { echo "missing build variable $v" >&2; exit 1; }
          done
          npm ci
          npm run build
      - name: Substitute the exact backend origin into Hosting CSP
        env:
          BACKEND_URL: ${{ needs.deploy-backend.outputs.url }}
        run: bash scripts/ci/set_eval_origin.sh "${BACKEND_URL%/}" eval/web/firebase.json
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.EVAL_WIF_PROVIDER }}
          service_account: ${{ vars.EVAL_DEPLOYER_SA }}
      - name: Configure the selected project Hosting target
        run: python3 scripts/ci/release_target.py hosting eval/web/firebase.json "$PROJECT" eval-staging "$EVAL_SITE"
      - name: Deploy only eval-staging Hosting
        run: npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} deploy --config eval/web/firebase.json --only "hosting:eval-staging" --project "$PROJECT" --non-interactive

  firestore:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.EVAL_WIF_PROVIDER }}
          service_account: ${{ vars.EVAL_DEPLOYER_SA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy rules and indexes to the eval database only
        run: npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} deploy --only firestore:eval --project "$PROJECT" --non-interactive

  smoke:
    needs: [deploy-backend, site, firestore]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Anonymous API is rejected and Hosting CSP permits the backend
        env:
          BACKEND_URL: ${{ needs.deploy-backend.outputs.url }}
        run: |
          origin="${BACKEND_URL%/}"
          code=000
          for i in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$origin/v1/me" || true)"
            [ "$code" = 401 ] && break
            echo "attempt $i: /v1/me -> $code; retrying"; sleep 6
          done
          [ "$code" = 401 ] || { echo "anonymous /v1/me returned $code, want 401" >&2; exit 1; }
          headers="$(curl -sfI --max-time 20 "https://$EVAL_SITE.web.app/")"
          echo "$headers" | grep -i '^content-security-policy:' | grep -qF "$origin" \
            || { echo "Hosting CSP missing backend $origin" >&2; exit 1; }
          echo "ok anonymous /v1/me -> 401; Hosting CSP permits $origin"
