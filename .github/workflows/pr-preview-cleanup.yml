name: pr-preview-cleanup

# Delete the PR preview: restore the onolys-api-staging service template to the serving revision (no-op normally),
# remove tag pr-<N> from it, delete that PR's revisions, delete Hosting channel pr-<N>. Not-found is ignored,
# so re-running on a clean PR succeeds. Same target and WIF identity as pr-preview.yml (isolated staging with the limited
# pr-preview-staging identity in vars.STAGING_GCP_PROJECT); same-repo PRs only (fork PRs have none).
# Authorized-domain note: firebase-tools may warn that it cannot remove the channel domain from Firebase Auth; the preview identity
# deliberately has no firebaseauth.admin, so that warning is accepted (previews use email/password, no Google sign-in).
# Shares the concurrency group with pr-preview.yml and cancels an in-flight deploy for the same PR.
on:
  pull_request:
    types: [closed]

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GCP_PROJECT: ${{ vars.STAGING_GCP_PROJECT }}
  PREVIEW_SITE: ${{ vars.STAGING_HOSTING_SITE }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  FIREBASE_TOOLS_VERSION: 15.37.0

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate the preview target before cloud authentication
        env:
          STAGING_GCP_PROJECT: ${{ vars.STAGING_GCP_PROJECT }}
          STAGING_PREVIEW_WIF_PROVIDER: ${{ vars.STAGING_PREVIEW_WIF_PROVIDER }}
          STAGING_PREVIEW_SA: ${{ vars.STAGING_PREVIEW_SA }}
          STAGING_HOSTING_SITE: ${{ vars.STAGING_HOSTING_SITE }}
        run: python3 scripts/ci/release_target.py preview-cleanup
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.STAGING_PREVIEW_WIF_PROVIDER }}
          service_account: ${{ vars.STAGING_PREVIEW_SA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove tag pr-<N>, delete its revisions and channel pr-<N> (ignore not-found)
        env:
          PR: ${{ github.event.number }}
        run: bash scripts/ci/pr_preview.sh cleanup "$PR"
