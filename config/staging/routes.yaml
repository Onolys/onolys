# Staging text routes use Claude Sonnet 5.5 with effort low.
# Gemini anchors remain for the unchanged oneshot baseline and forced-failure presets.
# Provider/model overrides are applied before presets (see docs/reference/infra.md).
_gemini: &gemini
  litellm_id: gemini/gemini-4-hydrogen
  api_key_env: GEMINI_API_KEY
  structured_output_mode: json_object
  caching_mode: provider_implicit
  supports_temperature: false
  max_output_tokens: 16000
  context_tokens: 1000000
  timeout_s: 180
  max_concurrency: 8
  max_retries: 3
  backoff_s: 2
  extra_params: {reasoning_effort: low}
_gemini_mid: &gemini_mid {<<: *gemini, litellm_id: gemini/gemini-4-neon}
cheap: &claude_default
  <<: *gemini
  litellm_id: anthropic/claude-sonnet-5-5
  api_key_env: ANTHROPIC_API_KEY
  caching_mode: anthropic_ephemeral
mid: *claude_default
strong: *claude_default
miti_code: {alias: mid}
miti_globals: {alias: mid}
tips: {alias: mid}
# Eval baseline has an explicit cap; the Claude preset overrides its provider too.
oneshot: {<<: *gemini_mid, max_output_tokens: 4096}

# Named bundles of route overrides (+ an STT key from stt_providers.yaml). DEFAULT_PRESET picks one.
presets:
  default:
    routes: {}
  claude:
    # Flip-back: the previous Claude Sonnet routes (needs ANTHROPIC_API_KEY on the worker).
    # `thinking` is deliberately not set: claude-sonnet-5-5 rejects {type: disabled}.
    routes:
      cheap: &claude
        litellm_id: anthropic/claude-sonnet-5-5
        api_key_env: ANTHROPIC_API_KEY
        structured_output_mode: json_object
        caching_mode: anthropic_ephemeral
        supports_temperature: false
        max_output_tokens: 16000
        context_tokens: 1000000
        timeout_s: 180
        max_concurrency: 8
        max_retries: 3
        backoff_s: 2
        extra_params: {}
      mid: *claude
      strong: *claude
      oneshot: {<<: *claude, max_output_tokens: 4096}

# Staging-only forced-failure presets (SP09 D4). Reachable via POST /runs {preset}; never in prod.
# Task routes are redefined as full working routes (not aliases) so they do not follow a broken `mid`.
  test-broken-llm:
    routes:
      cheap: {<<: *gemini, litellm_id: gemini/gemini-does-not-exist-0}
      mid: {<<: *gemini_mid, litellm_id: gemini/gemini-does-not-exist-0}
      strong: {<<: *gemini_mid, litellm_id: gemini/gemini-does-not-exist-0}
      miti_code: {<<: *gemini_mid, litellm_id: gemini/gemini-does-not-exist-0}
      miti_globals: {<<: *gemini_mid, litellm_id: gemini/gemini-does-not-exist-0}
      tips: {<<: *gemini_mid, litellm_id: gemini/gemini-does-not-exist-0}
  test-broken-tiers:
    routes:
      cheap: {<<: *gemini, litellm_id: gemini/gemini-does-not-exist-0}
      mid: {<<: *gemini_mid, litellm_id: gemini/gemini-does-not-exist-0}
      strong: {<<: *gemini_mid, litellm_id: gemini/gemini-does-not-exist-0}
      miti_code: {<<: *gemini_mid}
      miti_globals: {<<: *gemini_mid}
      tips: {<<: *gemini_mid}
