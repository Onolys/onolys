[project]
name = "onolys-oneshot"
version = "0.1.0"
description = "Config-driven one-call structured-output engine"
requires-python = ">=3.12,<3.13"
dependencies = ["onolys-engine-core"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onolys_oneshot"]

[tool.uv.sources]
onolys-engine-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = ["unit: fast, no network or external services", "live: real external providers"]
