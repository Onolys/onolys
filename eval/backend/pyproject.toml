[project]
name = "onolys-eval-backend"
version = "0.1.0"
description = "Allowlisted staging evaluation service for MITI engines"
requires-python = ">=3.12,<3.13"
dependencies = [
    "onolys-api",
    "onolys-engine-core",
    "onolys-miti[stt-google]",
    "onolys-oneshot",
    "onolys-eval",
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "google-cloud-tasks>=2.16",
    "uvicorn>=0.30",
    "google-auth>=2.35",
    "requests>=2.32",
    "google-cloud-storage>=2.18",
    "google-cloud-firestore>=2.19",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onolys_eval_backend"]

[tool.hatch.build.targets.wheel.force-include]
"prices.yaml" = "onolys_eval_backend/prices.yaml"

[tool.uv.sources]
onolys-api = { workspace = true }
onolys-engine-core = { workspace = true }
onolys-miti = { workspace = true }
onolys-oneshot = { workspace = true }
onolys-eval = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = ["unit: fast, no network or external services", "live: real external providers"]
