dataset_id: automisc-human
title: AutoMISC human-coded subsets (10 HLQC + 10 smoking-chatbot conversations)
license_note: 'Public GitHub repo (cimhasgithub/AutoMISC); GitHub reports no license. Paper: https://aclanthology.org/2025.nlpai4health-main.4/ (says code and annotated datasets are released, states no data license). HLQC text is the HLQC corpus; smoking transcripts come from a chatbot study. Internal evaluation use only; owner to confirm terms before any redistribution.'
source_page: https://github.com/cimhasgithub/AutoMISC
miti_version: null
label_scheme: MISC 2.5 (human) mapped to MITI counts
source_media:
- transcript
labels_summary: Human MISC 2.5 counsellor codes mapped to 9 MITI counts (not seek_collab); whole conversations coded; HLQC sessions also carry the high/low quality label
source_format: automisc_zip
source_files:
- https://github.com/cimhasgithub/AutoMISC/archive/refs/heads/main.zip
overlaps_with:
- dataset_id: hlqc
  note: The 10 hlqc-* sessions are HLQC conversations high_001, high_099, high_117, high_121, high_127, low_001, low_026, low_031, low_033, low_080 (same ids as in the hlqc dataset). Transcripts were re-parsed by AutoMISC into utterances, so turn text and count can differ from the hlqc dataset.
