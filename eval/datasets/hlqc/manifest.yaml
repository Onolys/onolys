dataset_id: hlqc
title: 'HLQC: high and low quality counseling (258 transcripts)'
license_note: Public download from the authors' page (web.eecs.umich.edu/~mihalcea) with no stated license. Internal evaluation use only; owner to confirm terms before any redistribution.
source_page: https://aclanthology.org/P19-1088/
miti_version: null
label_scheme: Session quality label (high/low) only
source_media:
- video
- transcript
transcript_origin: auto_captions
labels_summary: Session quality label (high/low) only; no behaviour counts or globals
source_format: hlqc_zip
source_files:
- https://web.eecs.umich.edu/~mihalcea/downloads/HighLowQualityCounseling.zip
overlaps_with:
- dataset_id: automisc-human
