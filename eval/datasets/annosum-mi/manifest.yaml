dataset_id: annosum-mi
title: 'AnnoSUM-MI: AnnoMI sessions with expert MITI-style ratings (131 transcripts)'
license_note: No licence file in repo; internal evaluation only; licence request sent to authors
source_page: https://github.com/vsrana-ai/AnnoSUM-MI
miti_version: null
label_scheme: 'AnnoSUM-MI: AnnoMI question label and expert empathy rating (partial)'
source_media:
- video
- transcript
transcript_origin: human
labels_summary: AnnoMI question label (main behaviour only) as 1 MITI count (question); expert empathy rating 1-5 as the empathy global; high/low quality; other ratings and all other counts not labeled
source_format: annosum_csv
source_files:
- https://raw.githubusercontent.com/vsrana-ai/AnnoSUM-MI/main/Dataset/train_dataset_MI_sessions.csv
- https://raw.githubusercontent.com/vsrana-ai/AnnoSUM-MI/main/Dataset/test_dataset_MI_sessions.csv
- https://raw.githubusercontent.com/vsrana-ai/AnnoSUM-MI/main/Dataset/train_data_MI_annotated.csv
- https://raw.githubusercontent.com/vsrana-ai/AnnoSUM-MI/main/Dataset/test_data_MI_annotated.csv
overlaps_with:
- dataset_id: annomi
  note: 'Same sessions: session ids equal AnnoMI transcript ids (transcript-<id>) for 131 of AnnoMI''s 133 transcripts (AnnoMI 47 and 129 are absent). Utterance ids and speakers match; 235 of 9,648 utterances carry small text edits (leading dashes dropped, minor punctuation or case changes, one blank utterance).'
